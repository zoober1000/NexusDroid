name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev liblzma-dev lld

    - name: Install Pip Packages (Buildozer & Cython)
      run: |
        python -m pip install --upgrade pip setuptools virtualenv
        pip install "Cython<3.0" buildozer

    - name: Build APK with Buildozer
      run: |
        # This bypasses interactive prompts and runs the build natively
        yes | buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: |
          .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/dists/*/bin/*.apk
          bin/*.apk
